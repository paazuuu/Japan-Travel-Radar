name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend / collector / worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx
      - name: Run pytest
        run: pytest tests/ -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
          rm -f .env

  integration-db:
    name: Integration (Postgres/PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: japan_travel
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d japan_travel"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://travel:travel@localhost:5432/japan_travel
      RUN_DB_TESTS: "1"
      RATE_LIMIT_PER_MIN: "0"
      COLLECTOR_DISABLE_NETWORK: "1"
      ADMIN_API_KEY: ci-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: |
          for f in database/migrations/*.sql; do
            echo "==> $f"; PGPASSWORD=travel psql -h localhost -U travel -d japan_travel -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Seed data
        run: |
          for f in database/seeds/seed_kansai.sql database/seeds/seed_events.sql database/seeds/seed_observations.sql; do
            echo "==> $f"; PGPASSWORD=travel psql -h localhost -U travel -d japan_travel -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run collector once (offline sources)
        working-directory: collector
        run: RUN_MODE=once python main.py
      - name: Run worker once (analysis + ranking)
        working-directory: worker
        run: RUN_MODE=once python main.py
      - name: Integration tests
        run: pytest tests/integration -q
